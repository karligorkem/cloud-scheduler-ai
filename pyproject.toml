[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-scheduler-ai"
version = "0.1.0"
description = "Reinforcement learning based cloud workload scheduler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]
rl = [
    "sb3-contrib>=2.7,<3",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"